project_id = "minarseafood"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Staff accounts are created from /admin/staff, never by self-service signup.
# Keep this off in the hosted project too (Authentication -> Sign In / Providers).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
